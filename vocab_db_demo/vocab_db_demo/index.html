<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VocabTrainer</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17243b;background:#f5f7fb;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}
.topbar{height:62px;background:#fff;border-bottom:1px solid #dbe3ef;display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:750;letter-spacing:-.4px}.brand-icon{font-size:25px}.spacer{flex:1}.user{font-size:13px;color:#52627a}
.app{display:flex;min-height:calc(100vh - 62px)}.sidebar{width:310px;flex:0 0 310px;background:#19283f;color:#eef4ff;display:flex;flex-direction:column;transition:transform .22s ease;z-index:4}.side-head{padding:16px 14px 10px}.root-add{width:100%;border:0;border-radius:9px;padding:12px 14px;background:#3973f4;color:white;text-align:left;font-weight:700}.root-add span{font-size:20px;margin-right:9px}.tree{padding:4px 8px 16px;overflow:auto;flex:1}.tree-row{display:flex;align-items:center;gap:4px;min-height:38px;border-radius:7px;padding:3px 6px;margin:2px 0}.tree-row.selected{background:#34548c}.tree-row:hover{background:#2a3d5b}.twisty,.node-name,.add-child{border:0;color:inherit;background:transparent}.twisty{width:22px;flex:0 0 22px;font-size:14px;opacity:.85;padding:3px 0}.node-name{flex:1;min-width:0;text-align:left;padding:6px 2px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-icon{width:18px;display:inline-block;margin-right:7px;opacity:.9}.add-child{width:25px;flex:0 0 25px;font-size:21px;line-height:25px;border-radius:5px}.add-child:hover{background:#425779}.tree-children{padding-left:17px}.side-foot{padding:14px;border-top:1px solid #344258;color:#cbd5e1;font-size:13px}
.mobile-toggle{display:none;border:1px solid #d5deeb;background:white;border-radius:8px;padding:7px 10px}.main{min-width:0;flex:1;padding:25px clamp(18px,3vw,42px);}.crumbs{font-size:12px;color:#64748b;margin:0 0 20px}.heading-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}.heading-row h1{font-size:25px;letter-spacing:-.5px;margin:0;flex:1}.icon-btn{border:1px solid #d3ddeb;background:white;border-radius:8px;padding:8px 11px;color:#31415c}.panel{background:white;border:1px solid #dce5f1;border-radius:11px;padding:17px;margin-bottom:14px;box-shadow:0 1px 2px #15294a08}.panel h2{font-size:13px;margin:0 0 10px;color:#415675}.translation{white-space:pre-wrap;line-height:1.65;font-size:15px;min-height:30px}.note{background:#fffaf1;border-color:#f7e6c7}.note h2{color:#9a5a16}.muted{color:#728198;font-size:13px}.empty-state{border:1px dashed #c9d5e5;border-radius:12px;padding:38px 22px;text-align:center;color:#62728a;background:#ffffffa8}.empty-state h2{color:#243550;margin:0 0 8px}.inline-add{margin-top:14px}.primary{border:0;background:#326cf0;color:#fff;border-radius:8px;padding:10px 14px;font-weight:650}.secondary{border:1px solid #d2dceb;background:#fff;color:#30415b;border-radius:8px;padding:10px 14px}.form-grid{display:grid;gap:13px}.field{display:grid;gap:6px;font-size:13px;font-weight:650;color:#344762}.field input,.field textarea{width:100%;border:1px solid #ccd7e5;border-radius:8px;padding:10px 11px;color:#17243b;background:#fff;font-weight:400}.field textarea{min-height:85px;resize:vertical}.form-actions{display:flex;gap:8px;flex-wrap:wrap}.form-title{margin:0 0 5px;font-size:22px}.notice{border-radius:8px;padding:11px 13px;background:#eef4ff;color:#294b88;font-size:13px;margin-bottom:14px;white-space:pre-wrap}.notice.error{background:#fff0f0;color:#9b2727}.child-list{display:grid;gap:8px}.child-card{display:flex;align-items:center;gap:12px;border:1px solid #dce5f1;border-radius:9px;padding:12px;background:#fff}.child-card .child-title{flex:1;font-weight:650}.child-card button{border:1px solid #d2dceb;background:#fff;border-radius:7px;padding:6px 9px}.hidden{display:none!important}
@media(max-width:760px){.mobile-toggle{display:inline-block}.sidebar{position:fixed;left:0;top:62px;bottom:0;transform:translateX(-102%);box-shadow:12px 0 35px #07162a30}.sidebar.open{transform:translateX(0)}.main{padding:20px 14px}.heading-row h1{font-size:21px}.user{display:none}}
</style>
</head>
<body>
<header class="topbar">
    <button id="menu-toggle" class="mobile-toggle" aria-label="Open navigation">
    ☰
    </button>
    <span class="brand-icon">
    ▱
    </span>
    <div class="brand">VocabTrainer</div>
    <div class="spacer"></div>
    <div class="user">Development workspace</div>
</header>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="side-head">
            <button class="root-add" id="add-root">
                <span>＋</span>
                New root section
            </button>
        </div>
        <nav class="tree" id="tree" aria-label="Vocabulary hierarchy">
        </nav>
        <div class="side-foot">
            Your vocabulary · nested sections
        </div>
    </aside>
    <main class="main" id="main">
        <div class="crumbs" id="crumbs">
            <!-- SORTA DI BARRA CON IL PERCORSO DI NAVIGAZIONE -->
            Home
        </div>
        <div id="notice" class="notice hidden" role="status">
        </div>
        <section id="content">
            <!-- QUI COMPARE 'Your vocabulary, organized your way' ECC. -->
        </section>
    </main>
</div>
<script>
    const API_BASE = ""; // contatto interfaccia API
    const treeEl = document.querySelector('#tree')  // central section of the sidebar
    const contentEl = document.querySelector('#content')    // qui compare 'Your vocabulary, organized your way' ecc.
    const crumbsEl = document.querySelector('#crumbs')  // sorta di barra con il percorso di navigazione
    const noticeEl = document.querySelector('#notice') // spazio dedicato alle segnalazioni - visibile soltanto in caso di necessità
    const sidebar = document.querySelector('#sidebar'); // barra di navigazione laterale
    let records = []
    let selectedId = null
    let expanded = new Set()
    let formParentId = null
    let formMode = null

    /* sostituzione caratteri speciali */
    function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    /* interfacci a FastAPI */
    async function api(path, options = {}) {
        const res = await fetch(API_BASE + path, { headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }, ...options });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail || `Request failed (${res.status})`)); return data;
    }

    /* comunicazione visibile */
    function showNotice(message, error = false) {
        noticeEl.textContent = message;
        noticeEl.classList.remove('hidden', 'error');
        if (error)
            noticeEl.classList.add('error');
    }

    /* comunicazione non visibile */
    function hideNotice() {
        noticeEl.classList.add('hidden');
    }

    /* restituisce tutte le sotto-sezioni di una sezione (id) */
    function childrenOf(id) {
        return records.filter(r => r.parent_id === id).sort((a, b) => (a.sort_order - b.sort_order) || (a.id - b.id));
    }

    /* associa un'icona a una sezione in base alla presenza o meno di effettive traduzioni o di sotto-sezioni */
    function iconFor(item) {
        return item.de != null && item.en != null ? '▤' : childrenOf(item.id).length ? '▰' : '▱';
    }

    function renderTree() {
        treeEl.replaceChildren();
        const roots = childrenOf(null);
        if (!roots.length) {
            const p = document.createElement('p');
            p.className = 'muted';
            p.textContent = 'No root sections yet. Use “New root section” to begin.';
            p.style.padding = '0 10px';
            treeEl.append(p);
            return;
        } for (const node of roots) treeEl.append(buildTreeNode(node, 0));
    }

    function buildTreeNode(node, depth) {
        const wrap = document.createElement('div');
        const row = document.createElement('div');
        row.className = 'tree-row' + (node.id === selectedId ? ' selected' : '');
        const kids = childrenOf(node.id); const isOpen = expanded.has(node.id);
        const twist = document.createElement('button');
        twist.className = 'twisty';
        twist.textContent = kids.length ? (isOpen ? '⌄' : '›') : ' ';
        twist.setAttribute('aria-label', isOpen ? 'Collapse section' : 'Expand section');
        twist.onclick = () => {
            if (isOpen)
                expanded.delete(node.id);
            else
                expanded.add(node.id);
            renderTree();
        };
        const name = document.createElement('button');
        name.className = 'node-name';
        name.innerHTML = `<span class="node-icon">${iconFor(node)}</span>${esc(node.title)}`;
        name.title = node.title;
        name.onclick = () => {
            selectedId = node.id;
            if (kids.length)
                expanded.add(node.id);
            renderTree();
            renderContent();
            if (innerWidth <= 760)
                sidebar.classList.remove('open');
        };
        const plus = document.createElement('button');
        plus.className = 'add-child';
        plus.textContent = '+';
        plus.title = `Add subsection under “${node.title}”`;
        plus.setAttribute('aria-label', plus.title);
        plus.onclick = () => {
            selectedId = node.id;
            expanded.add(node.id);
            renderTree();
            openCreate(node.id);
        };
        row.append(twist, name, plus);
        wrap.append(row);
        if (kids.length && isOpen) {
            const sub = document.createElement('div');
            sub.className = 'tree-children';
            for (const child of kids)
                sub.append(buildTreeNode(child, depth + 1));
            wrap.append(sub);
        } return wrap;
    }

    function pathFor(item) {
        const path = [];
        let current = item;
        while (current) {
            path.unshift(current);
            current = records.find(r => r.id === current.parent_id) || null;
        } return path;
    }

    function renderContent() {
        hideNotice();
        if (selectedId == null) {
            crumbsEl.textContent = 'Home';
            contentEl.innerHTML = `<div class="empty-state"><h2>Your vocabulary, organized your way</h2><p>Create a root section, then use the + beside any section to nest books, chapters, aphorisms, or vocabulary pairs to any depth.</p><button class="primary inline-add" id="welcome-add">＋ Create root section</button></div>`;
            document.querySelector('#welcome-add').onclick = () => openCreate(null);
            return;
        }
        const item = records.find(r => r.id === selectedId);
        if (!item) {
            selectedId = null;
            renderContent();
            return;
        }
        const path = pathFor(item);
        crumbsEl.textContent = 'Home  ›  ' + path.map(x => x.title).join('  ›  ');
        const kids = childrenOf(item.id);
        contentEl.innerHTML = `
            <div class="heading-row">
                <h1>${esc(item.title)}</h1>
                <button class="icon-btn" id="edit-item" title="Edit not yet available">
                    ✎
                </button>
            </div>${item.de != null ? `
                <section class="panel">
                    <h2>
                        German (original)
                    </h2>
                    <div class="translation">${esc(item.de)}</div>
                </section>
                <section class="panel">
                    <h2>
                        English (translation)
                    </h2>
                    <div class="translation">${esc(item.en)}</div>
                </section>` : ''}${item.note ? `
                <section class="panel note">
                    <h2>
                        Note
                    </h2>
                    <div class="translation">${esc(item.note)}</div>
                </section>` : ''}${Array.isArray(item.game_pairs) && item.game_pairs.length ? `
                <section class="panel">
                    <h2>
                        Saved game pairs
                    </h2>
                    <div class="child-list">
                        ${item.game_pairs.map((p, i) => `
                        <div class="child-card">
                            <span>${i + 1}.</span>
                            <div class="child-title">
                                ${esc(p.de || '—')}
                                <div class="muted">
                                    ${esc(p.en || '—')}
                                </div>
                            </div>
                        </div>`).join('')}
                    </div>
                </section>` : ''}
                <section class="panel">
                    <h2>
                        Subsections and items
                    </h2>${kids.length ? `
                    <div class="child-list">
                        ${kids.map(k => `
                        <div class="child-card">
                            <div class="child-title">
                                ${esc(k.title)}
                                <div class="muted">
                                    ${k.de != null ? 'German–English pair' : 'Section'} · ${childrenOf(k.id).length} child item(s)
                                </div>
                            </div>
                            <button data-open="${k.id}">
                                Open
                            </button>
                            <button data-add="${k.id}" aria-label="Add subsection under ${esc(k.title)}">
                                ＋
                            </button>
                        </div>`).join('')}
                    </div>` : '<p class="muted">No subsections yet.</p>'}
                    <button class="primary inline-add" id="add-child-main">
                        ＋ Add subsection here
                    </button>
                </section>`;
        document.querySelector('#add-child-main').onclick = () =>
            openCreate(item.id);
        contentEl.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
            selectedId = Number(b.dataset.open);
            expanded.add(item.id);
            renderTree();
            renderContent();
        });
        contentEl.querySelectorAll('[data-add]').forEach(b => b.onclick = () => openCreate(Number(b.dataset.add)));
        document.querySelector('#edit-item').onclick = () => showNotice('Editing existing items is not implemented in this first UI pass. Creating and navigating nested items is connected to the database.');
    }

    function openCreate(parentId) {
        formParentId = parentId;
        formMode = 'create';
        const parent = records.find(r => r.id === parentId);
        crumbsEl.textContent = 'Home  ›  ' + (parent ? pathFor(parent).map(x => x.title).join('  ›  ') + '  ›  New item' : 'New root section');
        contentEl.innerHTML = `
            <div class="heading-row">
                <h1>
                    ${parent ? 'Add subsection' : 'New root section'}
                </h1>
            </div>
            <div class="notice">
                ${parent ? `This item will be created under “${esc(parent.title)}” (parent ID ${parent.id}).` : 'This item will be a root section (parent ID is null).'}
            </div>
            <form id="create-form" class="panel form-grid">
                <label class="field">
                    Title *
                    <input name="title" required maxlength="500" placeholder="e.g. Erstes Buch">
                </label>
                <label class="field">
                    German original (optional)
                    <textarea name="de" placeholder="Leave both translation fields empty for a section">
                    </textarea>
                </label>
                <label class="field">
                    English translation (optional)
                    <textarea name="en" placeholder="Translation">
                    </textarea>
                </label>
                <label class="field">
                    Note (optional)
                    <textarea name="note" placeholder="Context, explanation, or reminder">
                    </textarea>
                </label>
                <label class="field">
                    Saved game pairs JSON (optional)
                    <textarea name="game_pairs" placeholder='[{"de":"...","en":"...","order":1}]'>
                    </textarea>
                </label>
                <div class="form-actions">
                    <button class="primary" type="submit">
                        Save item
                    </button>
                    <button class="secondary" type="button" id="cancel-create">
                        Cancel
                    </button>
                </div>
            </form>`;
        document.querySelector('#cancel-create').onclick = () =>
            renderContent();
        document.querySelector('#create-form').onsubmit = saveNewItem;
    }

    async function saveNewItem(event) {
        event.preventDefault();
        const form = event.currentTarget;
        const fd = new FormData(form);
        const de = String(fd.get('de') || '').trim(), en = String(fd.get('en') || '').trim();
        if (Boolean(de) !== Boolean(en)) {
            showNotice('Please provide both German and English, or leave both blank for a section.', true);
            return;
        }
        let gamePairs = null;
        const raw = String(fd.get('game_pairs') || '').trim();
        if (raw) {
            try {
                gamePairs = JSON.parse(raw);
                if (!Array.isArray(gamePairs))
                    throw new Error();
            } catch {
                showNotice('Saved game pairs must be valid JSON containing an array.', true);
                return;
            }
        }
        const payload = { title: String(fd.get('title') || '').trim(), de: de || null, en: en || null, note: String(fd.get('note') || '').trim() || null, parent_id: formParentId, game_pairs: gamePairs };
        const submit = form.querySelector('[type=submit]');
        submit.disabled = true;
        submit.textContent = 'Saving…';
        try {
            const created = await api('/api/word-pairs', { method: 'POST', body: JSON.stringify(payload) });
            records.push(created);
            selectedId = created.id;
            if (formParentId !== null)
                expanded.add(formParentId);
            expanded.add(created.id);
            renderTree();
            renderContent();
            showNotice(`Saved “${created.title}” successfully (ID ${created.id}).`);
        } catch (err) {
            showNotice(`Could not save: ${err.message}`, true);
            submit.disabled = false;
            submit.textContent = 'Save item';
        }
    }

    async function loadRecords() {
        try {
            records = await api('/api/word-pairs'); renderTree();
            if (selectedId !== null && records.some(r => r.id === selectedId))
                renderContent();
            else if (records.length) {
                selectedId = null; renderContent();
            } else {
                selectedId = null; renderContent();
            }
        } catch (err) {
            showNotice(`Could not load items: ${err.message}`, true);
        }
    }

    document.querySelector('#add-root').onclick = () => openCreate(null);
    document.querySelector('#menu-toggle').onclick = () => sidebar.classList.toggle('open');
    document.addEventListener('click', e => {
        if (innerWidth <= 760 && sidebar.classList.contains('open') && !sidebar.contains(e.target) && e.target.id !== 'menu-toggle')
            sidebar.classList.remove('open');
    });
    loadRecords();
</script>
</body>
</html>
