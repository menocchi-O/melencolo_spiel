<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Word Alignment Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
    }
    textarea {
      width: 100%;
      height: 150px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
    }
    pre {
      background: #f4f4f4;
      padding: 10px;
      margin-top: 20px;
    }
    table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 20px;
      }

    td, th {
          border: 1px solid #ccc;
          padding: 8px;
          text-align: left;
      }

    tr.selected {
          background-color: #d0ebff;
          cursor: pointer;
      }

    tr {
          cursor: pointer;
      }
  </style>
</head>
<body>

  <h1>Alignment Test</h1>

  <textarea id="inputText" placeholder="Paste German text here..."></textarea>
  <br />
  <button id="runBtn">Align</button>

  <div id="output"></div>
  <br />
  <button id="saveBtn">Save Selected</button>

  <script>
    const btn = document.getElementById("runBtn");
    const output = document.getElementById("output");

    btn.onclick = async () => {
      const text = document.getElementById("inputText").value;

      output.textContent = "⏳ Loading...";

      try {
        const res = await fetch("http://127.0.0.1:8000/align", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        const data = await res.json();
        // output.textContent = JSON.stringify(data, null, 2);
        renderTable(data.pairs);
      } catch (err) {
        output.textContent = "❌ Error: " + err;
      }
      };

      function renderTable(pairs) {
          const table = document.createElement("table");

          const thead = document.createElement("thead");
          thead.innerHTML = `
          <tr>
            <th>Keep</th>
            <th>German</th>
            <th>English</th>
          </tr>
          `;
          table.appendChild(thead);

          const tbody = document.createElement("tbody");

          pairs.forEach((pair, index) => {
              const tr = document.createElement("tr");
              tr.dataset.index = index;
              tr.classList.add("notSelected");

              tr.innerHTML = `
                <td>&#x2B1C</td>
                <td>${pair.de}</td>
                <td>${pair.en}</td>
              `;
              tr.onclick = () => {
                  tr.classList.toggle("notSelected");

                  const unchecked = tr.classList.contains("notSelected");
                  tr.children[0].textContent = unchecked ? "\u2B1C" : "\u2705"
              };

              tbody.appendChild(tr);
          });

          table.appendChild(tbody);

          output.innerHTML = "";
          output.appendChild(table);

      }
      document.getElementById("saveBtn").onclick = () => {
          const rows = document.querySelectorAll("tbody tr");
          const selected = [];

          rows.forEach(row => {
              if (!row.classList.contains("notSelected")) {
                  selected.push({
                      de: row.children[1].textContent,
                      en: row.children[2].textContent
                  });
              }
          });
          console.log("Selected pairs: ", selected);
      };
  </script>

</body>
</html>
