<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Word Alignment Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
    }
    textarea {
      width: 100%;
      height: 150px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
    }
    pre {
      background: #f4f4f4;
      padding: 10px;
      margin-top: 20px;
    }
      table {
          width: 100%;
          border-collapse: collapse;
          margin-top: 20px;
      }

      th, td {
          border: 1px solid #ddd;
          padding: 8px;
      }

      th {
          background: #f4f4f4;
      }

      tr:nth-child(even) {
          background: #fafafa;
      }

      td:first-child {
          text-align: center;
          width: 70px;
      }
    
  </style>
</head>
<body>

    <h1>Alignment Test</h1>

    <textarea id="inputText" placeholder="Paste German text here..."></textarea>
    <br />
    <button id="runBtn">Align</button>

    <table id="resultTable" style="display:none;">
        <thead>
            <tr>
                <th>Keep</th>
                <th>German</th>
                <th>English</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <button id="saveBtn" style="display:none;">
        Save Selected
    </button>

    <script>
        const btn = document.getElementById("runBtn");
        const table = document.getElementById("resultTable");
        const tbody = table.querySelector("tbody");
        const saveBtn = document.getElementById("saveBtn");

        btn.onclick = async () => {
            const text = document.getElementById("inputText").value;

            try {
                const res = await fetch("http://127.0.0.1:8000/align", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text })
                });

                const data = await res.json();

                tbody.innerHTML = "";

                data.pairs.forEach((pair, index) => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>
                            <input
                            type="checkbox"
                            unchecked
                            data-index="${index}">
                        </td>
                        <td>${pair.de}</td>
                        <td>${pair.en}</td>
                    `;

                    tbody.appendChild(row);
                });

                table.style.display = "table";
                saveBtn.style.display = "inline-block";
                
            } catch (err) {
                output.textContent = "❌ Error: " + err;
            }
        };

        saveBtn.onclick = async () => {

            const selected = [];

            tbody.querySelectorAll("tr").forEach((row, i) => {

                const checked = row.querySelector("input").checked;

                if (checked) {

                    selected.push({
                        de: row.cells[1].textContent,
                        en: row.cells[2].textContent
                    });

                }

            });

            console.log(selected);

            // POST to FastAPI if desired
            /*
            await fetch("/save", {
                method: "POST",
                headers: {
                    "Content-Type":"application/json"
                },
                body: JSON.stringify({
                    pairs: selected
                })
            });
            */
        };
    </script>

</body>
</html>
